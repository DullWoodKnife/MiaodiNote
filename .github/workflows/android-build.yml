name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERSION_CODE: ${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode Release Keystore (if available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "has_keystore=true" >> $GITHUB_ENV
        else
          echo "has_keystore=false" >> $GITHUB_ENV
        fi
      
    - name: Build Release APK
      if: env.has_keystore == 'true'
      env:
        KEYSTORE_PATH: app/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Build Debug APK
      if: env.has_keystore != 'true'
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Create GitHub Release (Release)
      if: env.has_keystore == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION_CODE }}
        name: MiaodiNote Release v${{ env.VERSION_CODE }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Create GitHub Release (Debug)
      if: env.has_keystore != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: debug-v${{ env.VERSION_CODE }}
        name: MiaodiNote Debug v${{ env.VERSION_CODE }}
        draft: false
        prerelease: true
        files: app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Clean up keystore
      if: always()
      run: rm -f app/release.keystore
